services:
  service-desk:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3002:3002"
    environment:
      BIND_HOST: 0.0.0.0
      DATA_FILE: /data/requests.json
      BACKUP_DIR: /backups
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-}
    volumes:
      - .:/app:ro
      - requests:/data
      - ./backups:/backups
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  vapi-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["voice"]
    command: tunnel --no-autoupdate --url http://service-desk:3002
    depends_on:
      service-desk:
        condition: service_healthy

volumes:
  requests:
